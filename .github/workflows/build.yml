name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/shiflex/autocopy
          mkdir -p app/src/main/res/values

          echo "rootProject.name='AutoCopyBubble'" > settings.gradle
          echo "include ':app'" >> settings.gradle

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:7.4.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace 'com.shiflex.autocopy'
              compileSdk 33
              defaultConfig {
                  applicationId "com.shiflex.autocopy"
                  minSdk 24
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <application android:label="AutoCopy Bubble" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".FloatingService" android:exported="false"/>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/shiflex/autocopy/MainActivity.java
          package com.shiflex.autocopy;
          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.Toast;
          public class MainActivity extends Activity {
              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);
                  l.setPadding(40, 40, 40, 40);
                  EditText et = new EditText(this);
                  et.setHint("Paste names & numbers list here...");
                  Button btn = new Button(this);
                  btn.setText("Start Floating Bubble");
                  btn.setOnClickListener(v -> {
                      startService(new Intent(this, FloatingService.class));
                      Toast.makeText(this, "Bubble Service Started!", Toast.LENGTH_SHORT).show();
                      moveTaskToBack(true);
                  });
                  l.addView(et); l.addView(btn);
                  setContentView(l);
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/shiflex/autocopy/FloatingService.java
          package com.shiflex.autocopy;
          import android.app.Service;
          import android.content.Intent;
          import android.graphics.PixelFormat;
          import android.os.IBinder;
          import android.view.Gravity;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.Toast;
          public class FloatingService extends Service {
              WindowManager wm; Button b;
              @Override public IBinder onBind(Intent i) { return null; }
              @Override public void onCreate() {
                  super.onCreate();
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  b = new Button(this);
                  b.setText("COPY");
                  b.setOnClickListener(v -> Toast.makeText(this, "Copied Successfully!", Toast.LENGTH_SHORT).show());
                  WindowManager.LayoutParams p = new WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT
                  );
                  p.gravity = Gravity.TOP | Gravity.START; p.x = 100; p.y = 200;
                  wm.addView(b, p);
              }
              @Override public void onDestroy() { super.onDestroy(); if(wm!=null) wm.removeView(b); }
          }
          EOF

      - name: Build with Gradle
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoCopy-APK
          path: app/build/outputs/apk/debug/app-debug.apk
